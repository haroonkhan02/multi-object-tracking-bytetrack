[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-object-tracking-bytetrack"
version = "0.1.0"
description = "Multi-object tracking by detection: YOLO detections, a Kalman-filter SORT baseline and ByteTrack, evaluated on MOT17 with HOTA, MOTA and IDF1."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Muhammad Haroon Khan" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "opencv-python>=4.9",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
detect = ["ultralytics>=8.3", "torch>=2.2"]
# TrackEval is not on PyPI; pinned to the last upstream commit.
eval = ["trackeval @ git+https://github.com/JonathonLuiten/TrackEval.git@12c8791b303e0a0b50f753af204249e622d0281a"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mot-download = "mot_track.download:main"
mot-check = "mot_track.dataset_stats:main"
mot-detect = "mot_track.detect:main"
mot-track = "mot_track.track:main"
mot-experiments = "mot_track.experiments:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
